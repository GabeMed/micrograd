[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micrograd-quantum"
version = "0.1.0"
description = "A scalar autograd engine with a classical MLP and a variational quantum circuit trained via the parameter-shift rule."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gabriel Medeiros" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Dataset, plots and the optional graphviz renderer used by the experiments
experiments = ["matplotlib>=3.7", "scikit-learn>=1.3", "graphviz>=0.20"]
dev = ["micrograd-quantum[experiments]", "pytest>=7", "ruff>=0.5"]
# Optional test-time cross-checks against reference frameworks
crosscheck = ["torch>=2.0", "pennylane>=0.35"]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_network"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip() without strict=
